name: Deploy resource booking plugin to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: sidebar-plugins/resource-booking-plugin/package-lock.json

      - name: Install dependencies
        working-directory: sidebar-plugins/resource-booking-plugin
        run: npm ci

      - name: Build
        working-directory: sidebar-plugins/resource-booking-plugin
        run: npm run build

      - name: Prepare Pages site
        run: |
          mkdir -p _site/sidebar-plugins/resource-booking-plugin
          cp -R sidebar-plugins/resource-booking-plugin/dist/* _site/sidebar-plugins/resource-booking-plugin/
          cat > _site/index.html <<'HTML'
          <!doctype html>
          <html lang="zh-CN">
            <head>
              <meta charset="UTF-8" />
              <meta name="viewport" content="width=device-width, initial-scale=1.0" />
              <title>lark-tools</title>
            </head>
            <body>
              <h1>lark-tools</h1>
              <ul>
                <li><a href="./sidebar-plugins/resource-booking-plugin/">Resource Booking Plugin</a></li>
              </ul>
            </body>
          </html>
          HTML

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
